name: Visual

# The six kept pictures of the room, compared nightly and on demand, in
# Playwright's own container at the version the workspace pins, so the
# browser, its software GPU and the fonts are the same every night. A
# picture that drifts fails this run with the diff as an artifact; it
# never blocks a push (ci.yml runs everything else on every push).
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e -- --project=visual --reporter=line
        env:
          VISUAL_SLOW: "2"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual
          path: apps/web/test-results
          retention-days: 14
